[[permission]]
identifier = "script-access"
description = "Load and save the active script and export through a native save dialog."
commands.allow = [
  "load_startup_script",
  "choose_script",
  "commit_script",
  "save_active_script",
  "export_file",
  "read_external_script",
  "acknowledge_script",
  "ensure_companion",
  "stop_companion",
]
